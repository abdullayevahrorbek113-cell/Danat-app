<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donat Do'koni</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f2f4fb; margin: 0; padding: 12px; }
    .card { background: #fff; border-radius: 16px; padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .label { font-size: 11px; color: #8e8e93; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 6px; display: block; }
    .input-group { display: flex; gap: 8px; }
    input { flex: 1; padding: 12px; border: 1px solid #e5e5ea; border-radius: 12px; font-size: 14px; outline: none; background: #f9f9fb; }
    .btn-check { background: #8e8cfa; color: white; border: none; padding: 0 16px; border-radius: 12px; font-weight: 600; font-size: 13px; cursor: pointer; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .item-card { background: #fff; border-radius: 14px; padding: 12px; text-align: center; border: 2px solid transparent; cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 6px rgba(0,0,0,0.03); }
    .item-card.active { border-color: #4f46e5; background: #f0f3ff; }
    .item-title { font-weight: 700; font-size: 14px; color: #1c1c1e; }
    .price { color: #3b82f6; font-weight: 700; font-size: 13px; margin-top: 4px; }
    .buy-btn { width: 100%; background: #4f46e5; color: white; border: none; padding: 16px; border-radius: 18px; font-weight: 700; font-size: 16px; margin-top: 15px; cursor: pointer; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }
  </style>
</head>
<body>

  <div class="card">
    <span class="label">PLAYER ID / O'YINCHI ID</span>
    <div class="input-group">
      <input type="text" id="player_id" placeholder="ID kiritiring...">
      <button class="btn-check" onclick="checkPlayer()">Tekshirish</button>
    </div>
    <div id="player_name" style="margin-top: 8px; font-size: 13px; color: #10b981; font-weight: 600;"></div>
  </div>

  <span class="label" style="margin-left: 4px;">MAHSULOTNI TANLANG</span>
  <div class="grid">
    <div class="item-card" onclick="selectItem('110_diamond', 10700, this)">
      <div class="item-title">110 💎</div>
      <div class="price">10 700 so'm</div>
    </div>
    <div class="item-card" onclick="selectItem('341_diamond', 32500, this)">
      <div class="item-title">341 💎</div>
      <div class="price">32 500 so'm</div>
    </div>
    <div class="item-card" onclick="selectItem('572_diamond', 52800, this)">
      <div class="item-title">572 💎</div>
      <div class="price">52 800 so'm</div>
    </div>
    <div class="item-card" onclick="selectItem('1166_diamond', 106000, this)">
      <div class="item-title">1166 💎</div>
      <div class="price">106 000 so'm</div>
    </div>
  </div>

  <button class="buy-btn" onclick="submitOrder()">Sotib olish</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let selectedProduct = null;

    function selectItem(id, price, element) {
      document.querySelectorAll('.item-card').forEach(el => el.classList.remove('active'));
      element.classList.add('active');
      selectedProduct = { id, price };
    }

    function checkPlayer() {
      const id = document.getElementById('player_id').value;
      if (!id) return alert("Iltimos, ID kiriting!");
      document.getElementById('player_name').innerText = "⏳ Tekshirilmoqda...";
      setTimeout(() => {
        document.getElementById('player_name').innerText = "✅ Nikneym topildi!";
      }, 800);
    }

    function submitOrder() {
      const id = document.getElementById('player_id').value;
      if (!id || !selectedProduct) {
        alert("Iltimos, ID kiriting va mahsulotni tanlang!");
        return;
      }
      tg.sendData(JSON.stringify({
        player_id: id,
        product: selectedProduct.id,
        price: selectedProduct.price
      }));
    }
  </script>
</body>
</html>
